[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinpart"
version = "0.1.0"
description = "Central hardware parts library, 3D models, EDA symbols, footprints and manifests for digitaltwin-run"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "digitaltwin-run"}]
dependencies = [
    "twin-kicad>=0.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
twinpart = "twinpart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twinpart = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
